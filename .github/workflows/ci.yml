name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install
      - name: Gradle assembleRelease
        run: cd android && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  maestro:
    name: Maestro smoke on emulator
    runs-on: ubuntu-latest
    needs: build-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-release-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install app-release.apk
            adb shell pm grant com.hansendev.desktofloor android.permission.CAMERA
            adb shell pm grant com.hansendev.desktofloor android.permission.RECORD_AUDIO
            maestro test .maestro/ --debug-output maestro-logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-logs
          path: maestro-logs

  nightly-release:
    name: Publish nightly APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: maestro
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-release-apk
      - name: Attach APK to rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-release.apk desk-to-floor-nightly.apk
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --title "Nightly build" --prerelease \
              --notes "Rolling nightly build."
          fi
          gh release upload nightly desk-to-floor-nightly.apk --clobber
          gh release edit nightly --notes "Rolling nightly build from \`${GITHUB_SHA::7}\` ($(date -u +'%Y-%m-%d %H:%M UTC')). Download desk-to-floor-nightly.apk on your phone and open it to sideload."
