# M5 flow: reach the coach screen and prove the key gate holds.
# Deliberately never enters a real key and never taps Generate — CI must not
# make a billed API call, and there is no key on the emulator anyway.
appId: com.hansendev.desktofloor
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Ready to train'
    timeout: 60000
- tapOn: 'Settings'
- extendedWaitUntil:
    visible: 'AI coach'
    timeout: 10000
- tapOn: 'AI coach'
- extendedWaitUntil:
    visible: 'API KEY'
    timeout: 10000
# Without a stored key the generate button is disabled and says so.
- assertVisible: 'Add a key first'
- assertVisible: 'Week 1'
- tapOn: 'Next week'
- assertVisible: 'Week 2'
- tapOn: 'Back'
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 10000
