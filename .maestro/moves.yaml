# M6 flow: reach a move's recording screen and confirm the record control
# works. Deliberately does NOT wait on a full record -> save -> retake round
# trip: whether the emulator's virtual camera actually produces a playable
# video file is unreliable in headless CI (four straight runs stalled on
# "Retake" never appearing after Stop recording, even with a 1.2s minimum
# recording floor and a 20s wait) — the flakiest-CI-stage gotcha in CLAUDE.md
# applies here same as elsewhere. Unit/component tests already cover the
# save/retake state machine with a mocked camera; this flow's job is proving
# the real wiring — permissions, navigation, CameraView mounting, the record
# button starting a real recordAsync() call — not that the emulator can
# actually finish and hand back a file.
appId: com.hansendev.desktofloor
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Ready to train'
    timeout: 60000
- tapOn: 'Settings'
- extendedWaitUntil:
    visible: 'Move reference clips'
    timeout: 10000
- tapOn: 'Move reference clips'
- extendedWaitUntil:
    visible: 'Wrist rocks'
    timeout: 10000
- tapOn: 'Wrist rocks'
- extendedWaitUntil:
    visible: 'Start recording'
    timeout: 10000
- tapOn: 'Start recording'
- extendedWaitUntil:
    visible: 'Stop recording'
    timeout: 10000
- tapOn: 'Stop recording'
- tapOn: 'Back'
- extendedWaitUntil:
    visible: 'Move reference clips'
    timeout: 10000
- tapOn: 'Back'
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 10000
